name: CI/CD Workflow
on: 
  pull_request:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/**'
env:
  PORT: ${{ vars.PORT }}
  API_TOKEN: ${{ secrets.API_TOKEN }}
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala as dependências
        run: npm install
        
      - name: Executa os testes
        run: npm test
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala as dependências
        run: npm install
        
      - name: Rodar o código
        run: npm run build